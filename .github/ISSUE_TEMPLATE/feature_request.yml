name: Feature request
description: Propose an improvement to the platform
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Market data
        - Data/feature pipeline
        - Paper exchange
        - Bots/experiments
        - API/backend
        - Frontend
        - News/social
        - Infrastructure/CI
        - Documentation
    validations:
      required: true
