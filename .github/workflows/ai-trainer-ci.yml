name: AiTrainer CI

on:
  push:
    branches: [main, dev]
    paths: ["AiTrainer/**", "shared/**", "pyproject.toml", ".github/workflows/ai-trainer-ci.yml"]
  pull_request:
    paths: ["AiTrainer/**", "shared/**", "pyproject.toml", ".github/workflows/ai-trainer-ci.yml"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check AiTrainer shared
      - run: ruff format --check AiTrainer shared
      - run: mypy AiTrainer/src shared/src
      - run: pytest AiTrainer/tests shared/tests --no-cov
