name: Dashboard Windows Build

on:
  push:
    branches: [main, dev]
    paths: ["Dashboard/**", "PaperTrading/**", "shared/**", "scripts/build-dashboard.ps1", "pyproject.toml", ".github/workflows/dashboard-windows-build.yml"]
  pull_request:
    paths: ["Dashboard/**", "PaperTrading/**", "shared/**", "scripts/build-dashboard.ps1", "pyproject.toml", ".github/workflows/dashboard-windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,dashboard,build]"
      - run: pytest Dashboard/tests --no-cov
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check Dashboard
      - run: mypy Dashboard/src Dashboard/tests
      - run: .\scripts\build-dashboard.ps1
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\PaperTradeAiTrainer\PaperTradeAiTrainer.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing $exe" }
      - uses: actions/upload-artifact@v6
        with:
          name: PaperTradeAiTrainer-windows-x64
          path: dist/PaperTradeAiTrainer/
          if-no-files-found: error
