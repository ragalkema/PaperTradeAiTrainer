name: Architecture CI

on:
  push:
    branches: [main, dev]
    paths:
      - "DataCollector/**"
      - "PaperTrading/**"
      - "AiTrainer/**"
      - "shared/**"
      - "tests/**"
      - "validation/**"
      - "pyproject.toml"
      - ".github/workflows/architecture-ci.yml"
  pull_request:
    paths:
      - "DataCollector/**"
      - "PaperTrading/**"
      - "AiTrainer/**"
      - "shared/**"
      - "tests/**"
      - "validation/**"
      - "pyproject.toml"
      - ".github/workflows/architecture-ci.yml"

permissions:
  contents: read

jobs:
  boundaries-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python validation/architecture/check_boundaries.py
      - run: pytest -m "not slow"
