[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-trade-ai-trainer"
version = "0.2.0"
description = "Clean Architecture foundation for AI crypto paper-trading research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["DataCollector/src", "PaperTrading/src", "AiTrainer/src", "shared/src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov --cov-report=term-missing --cov-fail-under=70"
testpaths = ["DataCollector/tests", "PaperTrading/tests", "AiTrainer/tests", "shared/tests", "tests"]
pythonpath = [".", "DataCollector/src", "PaperTrading/src", "AiTrainer/src", "shared/src"]
markers = [
  "unit: isolated tests without external resources",
  "integration: tests across infrastructure boundaries",
  "contract: compatibility tests between projects",
  "simulation: deterministic paper-exchange scenarios",
  "training: model-training tests",
  "validation: checks of real inputs, configuration, or state",
  "e2e: complete system flows",
  "slow: tests excluded from fast CI",
]

[tool.coverage.run]
branch = true
source = [
  "DataCollector/src/data_collector",
  "PaperTrading/src/paper_trading",
  "AiTrainer/src/ai_trainer",
  "shared/src/shared",
]

[tool.coverage.report]
omit = ["*/__init__.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["DataCollector/src", "PaperTrading/src", "AiTrainer/src", "shared/src", "tests"]
mypy_path = ["DataCollector/src", "PaperTrading/src", "AiTrainer/src", "shared/src"]
